name: Angular 19 reproducible cross-platform verification

on:
  push:
    branches:
      - chore/angular-19-migration-20261111
    paths:
      - '.github/workflows/angular-19-cross-platform.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
      - 'src/**'
      - 'tsconfig*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: angular19-crossplatform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Angular 19 install, tests, build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    steps:
      - name: Checkout Angular 19 feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use pinned Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Log toolchain
        run: |
          node --version
          npm --version

      - name: Reproducible install WITH postinstall scripts
        run: npm ci --no-audit --no-fund

      - name: Validate Angular dependency graph and versions
        run: |
          npm ls @angular/core @angular/cli @angular/material @angular-builders/custom-webpack jest-preset-angular typescript --depth=0
          node -e "const p=require('./package.json');const l=require('./package-lock.json'); if(p.devDependencies['@angular/core']!=='19.2.25' || p.devDependencies['@angular/cli']!=='19.2.27' || l.packages[''].devDependencies['@angular/core']!==p.devDependencies['@angular/core']) process.exit(1)"

      - name: Run entire unit test suite
        run: npm test

      - name: Compile Angular renderer and Electron main process
        run: npm run build:prod

      - name: Confirm tracked manifests unchanged
        shell: bash
        run: git diff --exit-code -- package.json package-lock.json
