name: Angular 22 compatibility probe (isolated)

on:
  push:
    branches:
      - chore/angular-22-probe-20261112
    paths:
      - '.github/angular-22-probe-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: angular22-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  angular22:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout Angular 21 migration baseline without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Supported Node runtime for Angular 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'

      - name: Remember exact Angular 21 lockfile versions
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const names={'CLI_FROM':'@angular/cli','CORE_FROM':'@angular/core','MATERIAL_FROM':'@angular/material','ESLINT_FROM':'@angular-eslint/schematics'};
          for(const [env,name] of Object.entries(names)){
            const found=lock.packages['node_modules/'+name]?.version;
            if(!found || !found.startsWith('21.'))throw new Error('Angular 21 source lock mismatch: '+name+' '+found);
            fs.appendFileSync(process.env.GITHUB_ENV,env+'='+found+'\n');
          }
          NODE

      - name: Prepare complete Angular 22 and ESLint 10 peer group in disposable runner
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(p.devDependencies['@angular/core']!=='^21.2.0' ||
             p.devDependencies['@angular/cli']!=='^21.2.0' ||
             p.devDependencies.typescript!=='5.9.3' ||
             p.devDependencies.rxjs!=='^7.8.2')throw new Error('Expected tested Angular 21 baseline');
          const names=['animations','common','compiler','compiler-cli','core','forms','language-service',
            'platform-browser','platform-browser-dynamic','router','cdk','material'];
          for(const name of names){
            const key='@angular/'+name;
            let found=false;
            for(const group of ['dependencies','devDependencies']){
              if(Object.hasOwn(p[group]??{},key)){p[group][key]='^22.2.0';found=true;}
            }
            if(!found)throw new Error('Expected Angular package missing: '+key);
          }
          Object.assign(p.devDependencies,{
            '@angular/cli':'^22.2.0',
            '@angular-devkit/build-angular':'^22.2.0',
            '@angular-builders/custom-webpack':'^22.0.1',
            typescript:'~6.0.0',
            eslint:'^10.12.0',
            '@typescript-eslint/eslint-plugin':'^8.72.2',
            '@typescript-eslint/parser':'^8.72.2',
          });
          let count=0;
          for(const key of Object.keys(p.devDependencies)){
            if(key.startsWith('@angular-eslint/')){p.devDependencies[key]='^22.0.0';count++;}
          }
          if(count!==5)throw new Error('Unexpected Angular ESLint group: '+count);
          fs.writeFileSync('package.json',JSON.stringify(p,null,4)+'\n');
          NODE

      - name: Resolve peers without force or legacy-peer-deps
        env:
          npm_config_ignore_scripts: 'true'
        run: |
          rm -rf node_modules package-lock.json
          npm install --ignore-scripts --no-audit --no-fund
          npm ls @angular/core @angular/cli @angular/material @angular-builders/custom-webpack @angular-eslint/schematics eslint @typescript-eslint/parser jest-preset-angular typescript --depth=0

      - name: Run official Angular 22 CLI Core and Material migrations
        env:
          NG_DISABLE_VERSION_CHECK: '1'
          npm_config_ignore_scripts: 'true'
        run: |
          CLI_TARGET="$(node -p "require('./node_modules/@angular/cli/package.json').version")"
          CORE_TARGET="$(node -p "require('./node_modules/@angular/core/package.json').version")"
          MATERIAL_TARGET="$(node -p "require('./node_modules/@angular/material/package.json').version")"
          echo "Angular 22 targets: CLI $CLI_TARGET, Core $CORE_TARGET, Material $MATERIAL_TARGET"
          npx ng update @angular/cli --migrate-only --from "$CLI_FROM" --to "$CLI_TARGET" --allow-dirty
          npx ng update @angular/core --migrate-only --from "$CORE_FROM" --to "$CORE_TARGET" --allow-dirty
          npx ng update @angular/material --migrate-only --from "$MATERIAL_FROM" --to "$MATERIAL_TARGET" --allow-dirty

      - name: Run Angular ESLint 22 migration schematics (do not skip legacy-config migration)
        env:
          NG_DISABLE_VERSION_CHECK: '1'
          npm_config_ignore_scripts: 'true'
        run: |
          TARGET="$(node -p "require('./node_modules/@angular-eslint/schematics/package.json').version")"
          npx ng update @angular-eslint/schematics --migrate-only --from "$ESLINT_FROM" --to "$TARGET" --allow-dirty

      - name: Upgrade Electron main-process module resolution away from deprecated Node10
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='tsconfig-serve.json';
          const p=JSON.parse(fs.readFileSync(path,'utf8'));
          if(p.compilerOptions.module!=='commonjs' ||
             p.compilerOptions.moduleResolution!=='node')throw new Error('Unexpected Electron TS compiler baseline');
          p.compilerOptions.module='Node16';
          p.compilerOptions.moduleResolution='node16';
          fs.writeFileSync(path,JSON.stringify(p,null,4)+'\n');
          NODE

      - name: Reinstall reproducibly from generated lockfile
        env:
          npm_config_ignore_scripts: 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Compile Electron and Angular renderer on TypeScript 6
        run: npm run build:prod

      - name: Install Electron executable for Jest
        run: node node_modules/electron/install.js

      - name: Execute complete unit test suite
        run: npm test

      - name: Report scope and pending validations
        if: always()
        run: |
          echo 'No generated migration files are committed by this disposable probe.'
          echo 'Not a lint, packaging, UI, database integration or independent review gate.'
          git status --short
          git diff --stat
