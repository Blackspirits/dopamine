name: Stage Angular 17 migration (feature branch only)

on:
  push:
    branches:
      - chore/angular-17-migration-20261111
    paths:
      - '.github/workflows/stage-angular-17.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-angular17-branch
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/chore/angular-17-migration-20261111'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout stage branch without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use officially supported Angular 17 Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.1'

      - name: Prepare reviewed Angular 17 manifest
        run: node scripts/migrations/stage-angular-17.cjs

      - name: Resolve fresh dependency graph in isolated runner
        env:
          npm_config_engine_strict: 'false'
          npm_config_ignore_scripts: 'true'
        run: |
          rm -rf node_modules package-lock.json
          npm install --ignore-scripts --no-audit --no-fund
          npm ls @angular/core @angular/cli @angular/material @angular-builders/custom-webpack @angular-eslint/schematics jest-preset-angular typescript --depth=0

      - name: Apply official v17 migrations without forcing peers
        env:
          NG_DISABLE_VERSION_CHECK: '1'
          npm_config_engine_strict: 'false'
          npm_config_ignore_scripts: 'true'
        run: |
          npx ng update @angular/cli --migrate-only --from 16.2.10 --to 17.3.17 --allow-dirty
          npx ng update @angular/core --migrate-only --from 16.2.12 --to 17.3.12 --allow-dirty
          npx ng update @angular/material --migrate-only --from 16.2.12 --to 17.3.10 --allow-dirty

      - name: Compile renderer and Electron main process
        run: npm run build:prod

      - name: Install Electron runtime for Jest imports
        run: node node_modules/electron/install.js

      - name: Run all unit tests
        run: npm test

      - name: Verify expected migration paths and version
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const actual = execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' })
            .trim().split('\n').filter(Boolean).sort();
          const expected = ['angular.json', 'package-lock.json', 'package.json'];
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error('Unexpected migration files: ' + JSON.stringify(actual));
          }
          const pkg = require('./package.json');
          if (pkg.devDependencies['@angular/core'] !== '17.3.12' ||
              pkg.devDependencies['@angular/cli'] !== '17.3.17') {
            throw new Error('Unexpected Angular versions');
          }
          NODE
          git diff --check

      - name: Transfer validated changes to isolated write job
        uses: actions/upload-artifact@v4
        with:
          name: angular17-generated
          path: |
            angular.json
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 7

  commit:
    name: Commit validated files to feature branch only
    needs: migrate
    if: github.ref == 'refs/heads/chore/angular-17-migration-20261111'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Restore generated and tested files
        uses: actions/download-artifact@v4
        with:
          name: angular17-generated
          path: .

      - name: Verify and commit without force
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const actual = execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' })
            .trim().split('\n').filter(Boolean).sort();
          const expected = ['angular.json', 'package-lock.json', 'package.json'];
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error('Unexpected artifact paths: ' + JSON.stringify(actual));
          }
          const pkg = require('./package.json');
          if (pkg.devDependencies['@angular/core'] !== '17.3.12' ||
              pkg.devDependencies['@angular/cli'] !== '17.3.17') {
            throw new Error('Unexpected migration artifact versions');
          }
          NODE
          git add -- angular.json package.json package-lock.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: migrate Angular 16 to 17 with official schematics'
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" push origin HEAD:refs/heads/chore/angular-17-migration-20261111
