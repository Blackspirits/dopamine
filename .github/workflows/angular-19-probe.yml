name: Angular 19 compatibility probe (isolated)

on:
  push:
    branches:
      - chore/angular-19-probe-20261111
    paths:
      - '.github/workflows/angular-19-probe.yml'
      - 'src/app/ui/directives/controls-visibility.directive.spec.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: angular19-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  angular19:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout validated Angular 18 baseline
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use officially supported Angular 19 Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'

      - name: Prepare Angular 19 dependency graph in disposable runner
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (p.devDependencies?.['@angular/core'] !== '18.2.14' ||
              p.devDependencies?.['@angular/cli'] !== '18.2.21') {
            throw new Error('Expected validated Angular 18 baseline; re-inspect before retry.');
          }
          const names = ['animations', 'common', 'compiler', 'compiler-cli', 'core', 'forms',
            'language-service', 'platform-browser', 'platform-browser-dynamic',
            'router', 'cdk', 'material'];
          for (const name of names) {
            const key = '@angular/' + name;
            let found = false;
            for (const group of ['devDependencies', 'dependencies']) {
              if (Object.hasOwn(p[group] ?? {}, key)) {
                p[group][key] = '^19.2.0';
                found = true;
              }
            }
            if (!found) throw new Error('Expected Angular package missing: ' + key);
          }
          Object.assign(p.devDependencies, {
            '@angular/cli': '^19.2.0',
            '@angular-devkit/build-angular': '^19.2.0',
            '@angular-builders/custom-webpack': '^19.0.0',
            typescript: '~5.8.3',
            'zone.js': '~0.15.0',
          });
          let count = 0;
          for (const name of Object.keys(p.devDependencies)) {
            if (name.startsWith('@angular-eslint/')) {
              p.devDependencies[name] = '^19.0.0';
              count++;
            }
          }
          if (count !== 5) throw new Error('Unexpected Angular ESLint package set: ' + count);
          fs.writeFileSync('package.json', JSON.stringify(p, null, 4) + '\n');
          console.log('Prepared graph without forcing peer dependencies.');
          NODE

      - name: Resolve clean Angular 19 graph
        env:
          npm_config_ignore_scripts: 'true'
        run: |
          rm -rf node_modules package-lock.json
          npm install --ignore-scripts --no-audit --no-fund
          npm ls @angular/core @angular/cli @angular/material @angular-builders/custom-webpack @angular-eslint/schematics jest-preset-angular typescript --depth=0

      - name: Apply official Angular 19 CLI Core and Material migrations
        env:
          NG_DISABLE_VERSION_CHECK: '1'
          npm_config_ignore_scripts: 'true'
        run: |
          CLI_TARGET="$(node -p "require('./node_modules/@angular/cli/package.json').version")"
          CORE_TARGET="$(node -p "require('./node_modules/@angular/core/package.json').version")"
          MATERIAL_TARGET="$(node -p "require('./node_modules/@angular/material/package.json').version")"
          echo "Targets: CLI $CLI_TARGET; Core $CORE_TARGET; Material $MATERIAL_TARGET"
          npx ng update @angular/cli --migrate-only --from 18.2.21 --to "$CLI_TARGET" --allow-dirty
          npx ng update @angular/core --migrate-only --from 18.2.14 --to "$CORE_TARGET" --allow-dirty
          npx ng update @angular/material --migrate-only --from 18.2.14 --to "$MATERIAL_TARGET" --allow-dirty
          git diff --stat

      - name: Compile Angular renderer and Electron main
        run: npm run build:prod

      - name: Install Electron runtime for Jest tests
        run: node node_modules/electron/install.js

      - name: Run entire unit test suite
        run: npm test

      - name: Report result and limits
        if: always()
        run: |
          echo 'All Angular 19 migration changes are runner-local and are NOT committed.'
          echo 'A green probe is NOT native packaging, reproducible npm ci, UI regression or merge approval.'
          git status --short
