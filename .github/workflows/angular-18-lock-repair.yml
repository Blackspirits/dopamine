name: Repair Angular 18 lockfile (feature branch only)

on:
  push:
    branches:
      - chore/angular-18-migration-20261111
    paths:
      - '.github/workflows/angular-18-lock-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repair-angular18-lockfile
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/chore/angular-18-migration-20261111'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact feature branch without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use supported Node 22 runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'

      - name: Regenerate lockfile from clean dependency graph (runner only)
        run: |
          node --version
          npm --version
          rm -rf node_modules package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Reproducible clean install with native postinstall scripts
        run: npm ci --no-audit --no-fund

      - name: Check installed toolchain and lockfile consistency
        run: |
          npm ls @angular/core @angular/cli @angular/material @angular-builders/custom-webpack typescript --depth=0
          node <<'NODE'
          const manifest = require('./package.json');
          const lock = require('./package-lock.json');
          if (manifest.devDependencies['@angular/core'] !== '18.2.14' ||
              manifest.devDependencies['@angular/cli'] !== '18.2.21') {
            throw new Error('Expected Angular 18 manifest');
          }
          if (JSON.stringify(lock.packages[''].devDependencies) !== JSON.stringify(manifest.devDependencies)) {
            throw new Error('Lockfile root dependency manifest is inconsistent');
          }
          NODE

      - name: Compile production renderer and Electron main process
        run: npm run build:prod

      - name: Run full unit tests
        run: npm test

      - name: Permit only package-lock.json modification
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const files = execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' })
            .trim().split('\n').filter(Boolean);
          if (files.length !== 1 || files[0] !== 'package-lock.json') {
            throw new Error('Unexpected generated paths: ' + JSON.stringify(files));
          }
          NODE
          git diff --check

      - name: Upload only verified lockfile
        uses: actions/upload-artifact@v4
        with:
          name: angular18-repaired-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

  commit:
    needs: verify
    if: github.ref == 'refs/heads/chore/angular-18-migration-20261111'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Restore verified lockfile
        uses: actions/download-artifact@v4
        with:
          name: angular18-repaired-lock
          path: .

      - name: Verify and commit lockfile only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const files = execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' })
            .trim().split('\n').filter(Boolean);
          if (files.length !== 1 || files[0] !== 'package-lock.json') {
            throw new Error('Unexpected artifact paths: ' + JSON.stringify(files));
          }
          const manifest = require('./package.json');
          const lock = require('./package-lock.json');
          if (JSON.stringify(lock.packages[''].devDependencies) !== JSON.stringify(manifest.devDependencies)) {
            throw new Error('Lockfile manifest mismatch');
          }
          NODE
          git add -- package-lock.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: regenerate Angular 18 lockfile for reproducible npm ci'
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" push origin HEAD:refs/heads/chore/angular-18-migration-20261111
