name: Angular 17 non-destructive migration probe
on:
  push:
    branches:
      - chore/angular-17-probe-20261111
    paths:
      - '.github/workflows/angular-17-probe.yml'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CI: 'true'
      NG_CLI_ANALYTICS: 'false'
      # Temporary tooling-only exception: @electron/rebuild requires Node >=22.12;
      # Angular 17 schematics require Node 20. Do not apply to real builds.
      npm_config_engine_strict: 'false'
      npm_config_ignore_scripts: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.1'
          cache: npm
      - name: Show runtime versions
        run: node --version && npm --version
      - name: Install tooling only; skip Electron native postinstall scripts
        run: npm ci --ignore-scripts
      - name: Align Jest peer range with Angular 17 (tooling only)
        run: npm install --save-dev jest-preset-angular@13.1.6
      - name: Run coordinated Angular 16 -> 17 migrations
        id: migrate
        continue-on-error: true
        run: |
          npx ng update \
            @angular/cli@17 \
            @angular/core@17 \
            @angular/material@17 \
            @angular-eslint/schematics@17 \
            @angular-builders/custom-webpack@17 \
            angular-split@17.2.0 \
            --allow-dirty
      # The migration schematics run with Node 20 tooling only. Test the
      # generated workspace with the same Node 22 runtime used by upstream CI.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - name: Install migrated workspace with native scripts
        id: fullinstall
        continue-on-error: true
        env:
          npm_config_engine_strict: 'true'
          npm_config_ignore_scripts: 'false'
        run: npm ci
      - name: Run Angular 17 unit tests
        id: unit17
        if: steps.fullinstall.outcome == 'success'
        continue-on-error: true
        run: npm test
      - name: Build Angular 17 production renderer
        id: build17
        if: steps.fullinstall.outcome == 'success'
        continue-on-error: true
        run: npm run build:prod
      - name: Measure Angular 17 lint debt (baseline already fails)
        id: lint17
        if: steps.fullinstall.outcome == 'success'
        continue-on-error: true
        run: npm run lint
      - name: Show candidate modifications and installed versions
        if: always()
        run: |
          git status --short
          git diff --stat
          node -e 'let p=require("./package.json"); console.log(JSON.stringify({angular:p.devDependencies["@angular/core"],cli:p.devDependencies["@angular/cli"],typescript:p.devDependencies.typescript,customWebpack:p.devDependencies["@angular-builders/custom-webpack"],material:p.dependencies["@angular/material"],split:p.dependencies["angular-split"],rxjs:p.devDependencies.rxjs},null,2))'
          git diff --binary > angular-17-migration.patch
      - name: Upload generated patch for inspection (not committed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angular-17-probe-diff
          path: angular-17-migration.patch
          if-no-files-found: error
      - name: Report migration result
        if: always()
        env:
          MIGRATE_OUTCOME: ${{ steps.migrate.outcome }}
          FULL_INSTALL: ${{ steps.fullinstall.outcome }}
          UNIT: ${{ steps.unit17.outcome }}
          BUILD: ${{ steps.build17.outcome }}
          LINT: ${{ steps.lint17.outcome }}
        run: |
          echo "Angular 17 migration: $MIGRATE_OUTCOME"
          echo "Angular 17 full install: $FULL_INSTALL"
          echo "Angular 17 tests: $UNIT"
          echo "Angular 17 build: $BUILD"
          echo "Angular 17 lint (informational: prior baseline red): $LINT"
          test "$MIGRATE_OUTCOME" = success
          test "$FULL_INSTALL" = success
          test "$UNIT" = success
          test "$BUILD" = success
