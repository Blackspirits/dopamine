name: Angular 20 reproducible cross-platform verification

on:
  push:
    branches:
      - chore/angular-20-migration-20261111
    paths:
      - '.github/workflows/angular-20-platform-verification.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: angular20-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Angular 20 npm ci, unit tests, build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    steps:
      - name: Checkout without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up tested Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Verify manifest and baseline versions before installing
        run: |
          node -e "const p=require('./package.json'); if(p.devDependencies['@angular/core']!=='20.3.35'||p.devDependencies['@angular/cli']!=='20.3.42'||p.dependencies['@angular/material']!=='20.2.14')process.exit(1)"

      - name: Reproducible install including native postinstall scripts
        run: npm ci --no-audit --no-fund

      - name: Verify dependency tree
        run: npm ls @angular/core @angular/cli @angular/material @angular-builders/custom-webpack typescript --depth=0

      - name: Run complete unit test suite
        run: npm test

      - name: Build renderer and Electron main process
        run: npm run build:prod

      - name: Ensure lockfile and manifest remain unchanged
        shell: bash
        run: git diff --exit-code -- package.json package-lock.json
