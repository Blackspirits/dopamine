name: Stage Angular 19 migration (isolated feature branch only)

on:
  push:
    branches:
      - chore/angular-19-migration-20261111
    paths:
      - '.github/angular-19-stage-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-angular19-feature-branch
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/chore/angular-19-migration-20261111'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout migration branch without write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Supported Node for Angular 19 and Electron
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'

      - name: Prepare guarded Angular 19 manifest
        run: node scripts/migrations/stage-angular-19.cjs

      - name: Resolve clean dependencies without forcing peers
        env:
          npm_config_ignore_scripts: 'true'
        run: |
          rm -rf node_modules package-lock.json
          npm install --ignore-scripts --no-audit --no-fund
          npm ls @angular/core @angular/cli @angular/material @angular-builders/custom-webpack @angular-eslint/schematics jest-preset-angular typescript --depth=0

      - name: Apply official Angular 19 CLI Core and Material schematics
        env:
          NG_DISABLE_VERSION_CHECK: '1'
          npm_config_ignore_scripts: 'true'
        run: |
          npx ng update @angular/cli --migrate-only --from 18.2.21 --to 19.2.27 --allow-dirty
          npx ng update @angular/core --migrate-only --from 18.2.14 --to 19.2.25 --allow-dirty
          npx ng update @angular/material --migrate-only --from 18.2.14 --to 19.2.19 --allow-dirty

      - name: Prove the generated lockfile installs reproducibly
        env:
          npm_config_ignore_scripts: 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Compile renderer and Electron main process
        run: npm run build:prod

      - name: Install Electron executable for Jest imports
        run: node node_modules/electron/install.js

      - name: Run all unit tests
        run: npm test

      - name: Audit generated file paths and exact versions
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          changed = sorted(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          def allowed(name):
              return name in {
                  'angular.json', 'package.json', 'package-lock.json',
                  'src/css/angular-material-theming.scss', 'tsconfig-serve.json',
              } or (name.startswith('src/app/') and name.endswith('.ts'))

          unexpected = [p for p in changed if not allowed(p)]
          components = sum(p.startswith('src/app/') and p.endswith('.ts') for p in changed)
          if unexpected or not (100 <= components <= 220):
              raise SystemExit(f'Unexpected migration scope: {len(changed)} files, {components} TS files, unexpected={unexpected}')
          for path in changed:
              if not Path(path).is_file():
                  raise SystemExit(f'Nonregular or missing file: {path}')
          pkg = json.loads(Path('package.json').read_text())
          lock = json.loads(Path('package-lock.json').read_text())
          if pkg['devDependencies']['@angular/core'] != '19.2.25' or pkg['devDependencies']['@angular/cli'] != '19.2.27':
              raise SystemExit('Unexpected Angular 19 versions')
          if lock['packages']['']['devDependencies']['@angular/core'] != '19.2.25':
              raise SystemExit('Lockfile root does not match manifest')
          print(f'Expected Angular 19 diff: {len(changed)} files, {components} Angular TS files')
          PY
          git diff --check

      - name: Bundle ONLY changed files as a verified tar artifact
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import tarfile
          from pathlib import Path
          names = sorted(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          with tarfile.open('angular19-generated.tar.gz', 'w:gz') as archive:
              for name in names:
                  if not Path(name).is_file():
                      raise SystemExit('Not a regular file: ' + name)
                  archive.add(name, arcname=name, recursive=False)
          Path('angular19-paths.json').write_text(json.dumps(names, indent=2) + '\n')
          PY

      - name: Send validated artifact to isolated commit job
        uses: actions/upload-artifact@v4
        with:
          name: angular19-generated
          path: |
            angular19-generated.tar.gz
            angular19-paths.json
          if-no-files-found: error
          retention-days: 7

  commit:
    name: Publish validated Angular 19 files to feature branch only
    needs: migrate
    if: github.ref == 'refs/heads/chore/angular-19-migration-20261111'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout target branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download tested files
        uses: actions/download-artifact@v4
        with:
          name: angular19-generated
          path: .migration-artifact

      - name: Validate and restore allowlisted artifact files
        run: |
          python3 - <<'PY'
          import json
          import tarfile
          import subprocess
          from pathlib import Path

          root = Path('.migration-artifact')
          names = json.loads((root / 'angular19-paths.json').read_text())
          def allowed(name):
              p = Path(name)
              return not p.is_absolute() and '..' not in p.parts and (
                  name in {'angular.json', 'package.json', 'package-lock.json',
                           'src/css/angular-material-theming.scss', 'tsconfig-serve.json'} or
                  (name.startswith('src/app/') and name.endswith('.ts'))
              )
          if len(names) != len(set(names)) or not names or not all(allowed(n) for n in names):
              raise SystemExit('Unexpected, duplicate or unsafe file names in artifact')
          with tarfile.open(root / 'angular19-generated.tar.gz', 'r:gz') as archive:
              members = archive.getmembers()
              if sorted(m.name for m in members) != sorted(names) or any(not m.isfile() for m in members):
                  raise SystemExit('Archive does not match allowlisted regular files')
              for member in members:
                  target = Path(member.name)
                  if not target.is_file():
                      raise SystemExit('Expected tracked file missing: ' + member.name)
                  with archive.extractfile(member) as source, target.open('wb') as out:
                      import shutil
                      shutil.copyfileobj(source, out)
          changed = sorted(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if changed != sorted(names):
              raise SystemExit('Restored diff differs from validated source artifact')
          pkg = json.loads(Path('package.json').read_text())
          if pkg['devDependencies']['@angular/core'] != '19.2.25':
              raise SystemExit('Invalid Angular version in restored source')
          print(f'Validated and restored {len(changed)} changed files')
          PY

      - name: Commit and push fast-forward to feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --check
          git diff --name-only -z | xargs -0 git add --
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: migrate Angular 18 to 19 using official schematics'
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" push origin HEAD:refs/heads/chore/angular-19-migration-20261111
