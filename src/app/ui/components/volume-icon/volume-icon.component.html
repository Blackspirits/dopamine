<div class="app-volume-icon">
    @if (this.volume === 0) {
        <i class="app-volume-icon__icon__alt las la-volume-mute"></i>
    }
    @if (this.volume > 0 && this.volume < 0.5) {
        <i class="app-volume-icon__icon__alt las la-volume-down"></i>
    }
    @if (this.volume >= 0.5) {
        <i class="app-volume-icon__icon las la-volume-up"></i>
    }
</div>
