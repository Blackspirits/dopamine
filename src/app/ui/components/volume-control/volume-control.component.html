<div class="app-volume-control">
    <div class="pointer" (click)="this.toggleMute()" matTooltip="{{ (this.volume === 0 ? 'unmute' : 'mute') | translate }}">
        @if (this.volume === 0) {
            <i class="app-volume-control__icon__alt las la-volume-mute"></i>
        }
        @if (this.volume > 0 && this.volume < 0.5) {
            <i class="app-volume-control__icon__alt las la-volume-down"></i>
        }
        @if (this.volume >= 0.5) {
            <i class="app-volume-control__icon las la-volume-up"></i>
        }
    </div>
    <app-slider
        class="app-volume-control__slider ml-3 mr-2"
        [stepSize]="0.01"
        [maximum]="1"
        [mouseStepSize]="0.05"
        [(value)]="this.volume"
    ></app-slider>
</div>
