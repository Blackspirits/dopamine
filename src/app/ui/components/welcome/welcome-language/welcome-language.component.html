<div class="d-flex flex-column p-3">
    <div class="title">
        {{ 'language' | translate }}
    </div>
    <div class="larger">
        {{ 'pick-your-language' | translate }}
    </div>
    <div class="mt-3">
        <mat-form-field>
            <mat-select
                [(ngModel)]="translatorService.selectedLanguage"
                [compareWith]="translatorService.compareLanguages"
                (openedChange)="translatorService.refreshLanguages()"
            >
                @for (language of translatorService.languages; track language) {
                    <mat-option [value]="language">
                        @if (!language.showEnglishName) {
                            <div>{{ language.localizedName }}</div>
                        }
                        @if (language.showEnglishName) {
                            <div>{{ language.localizedName }} ({{ language.englishName }})</div>
                        }
                    </mat-option>
                }
            </mat-select>
        </mat-form-field>
    </div>
</div>
