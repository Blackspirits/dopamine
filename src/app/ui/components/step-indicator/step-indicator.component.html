<div class="step-indicator-component">
    @for (step of totalStepsCollection; track step) {
        <div>
            @if (step === currentStep) {
                <div class="step-indicator-component__activedot"></div>
            }
            @if (step !== currentStep) {
                <div class="step-indicator-component__inactivedot"></div>
            }
        </div>
    }
</div>
