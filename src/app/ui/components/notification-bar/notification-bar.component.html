<div
    [@expandCollapse]="isExpanded ? 'expanded' : 'collapsed'"
    class="notification-bar__background d-flex flex-row justify-content-between align-items-center px-2"
>
    <div class="d-flex flex-row align-items-center">
        @if (!notificationData?.animateIcon) {
            <i class="notification-bar__icon mr-2" [ngClass]="notificationData?.icon"></i>
        }
        @if (notificationData?.animateIcon) {
            <i class="notification-bar__icon mr-2 rotation" [ngClass]="notificationData?.icon"></i>
        }
        <div class="notification-bar__text">
            {{ notificationData?.message }}
        </div>
    </div>
    @if (notificationData?.showCloseButton) {
        <i class="notification-bar__closebutton las la-times pl-4" (click)="dismiss()"></i>
    }
</div>
