<div class="app-genre">
    @if (genre.isZoomHeader) {
        <div class="app-genre__header pointer mx-1" (click)="this.requestZoomOut()">
            {{ genre.zoomHeaderText }}
        </div>
    }
    @if (!genre.isZoomHeader) {
        <div
            class="app-genre__name ellipsis px-1"
            [ngClass]="{ 'selected-item-background-important': genre.isSelected }"
            matRipple
            [matRippleTrigger]="trigger"
            #trigger
        >
            {{ genre.displayName }}
        </div>
    }
</div>
