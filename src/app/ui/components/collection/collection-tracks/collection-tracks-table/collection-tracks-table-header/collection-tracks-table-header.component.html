<div class="d-flex flex-row">
    @if (this.icon != undefined && this.isOrderedBy) {
        <div class="accent-color ellipsis" [ngClass]="this.icon"></div>
    }
    @if (this.icon != undefined && !this.isOrderedBy) {
        <div class="secondary-text ellipsis" [ngClass]="this.icon"></div>
    }
    @if (this.icon == undefined) {
        <div class="secondary-text ellipsis" [ngClass]="{ 'accent-color-important': this.isOrderedBy }">
            {{ this.text }}
        </div>
    }
    @if (this.isOrderedBy) {
        <div class="d-flex flex-row align-items-center">
            @if (!this.isOrderedAscending) {
                <i class="secondary-text ellipsis las la-angle-up ml-1" [ngClass]="{ 'accent-color-important': this.isOrderedBy }"></i>
            }
            @if (this.isOrderedAscending) {
                <i class="secondary-text ellipsis las la-angle-down ml-1" [ngClass]="{ 'accent-color-important': this.isOrderedBy }"> </i>
            }
        </div>
    }
</div>
